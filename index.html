<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P ASCII Roguelike</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Include PeerJS library (SOW II.B.1, III.3.2) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="landing-page">
            <h1>P2P ASCII Roguelike</h1>
            <div class="buttons">
                <button id="create-world-btn">Create World</button>
                <button id="join-world-btn">Join World</button>
            </div>
            <div id="join-form" class="hidden">
                <input type="text" id="session-key-input" placeholder="Enter session key">
                <button id="connect-btn">Connect</button>
            </div>
            <div id="session-info" class="hidden">
                <p>Your session key: <span id="session-key"></span></p>
                <p>Share this key with others to join your world</p>
            </div>
        </div>
        
        <div id="game-view" class="hidden">
            <div id="game-container"></div>
            <!-- Touch Controls -->
            <div id="touch-controls">
                <button class="touch-btn" id="touch-up">▲</button>
                <div>
                    <button class="touch-btn" id="touch-left">◀</button>
                    <button class="touch-btn" id="touch-down">▼</button>
                    <button class="touch-btn" id="touch-right">▶</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- PeerJS library included in <head> is sufficient -->
    <!-- <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script> -->
    
    <!-- Remove redundant script tags for modules; app.js will import them -->
    <!-- <script src="js/connection/p2p.js"></script> -->
    <!-- <script src="js/connection/signaling.js"></script> -->
    
    <!-- <script src="js/game/dungeon.js"></script> -->
    <!-- <script src="js/game/player.js"></script> -->
    <!-- <script src="js/game/renderer.js"></script> -->
    <!-- <script src="js/game/input.js"></script> -->
    
    <!-- <script src="js/ui/landing.js"></script> -->
    <!-- <script src="js/ui/game-view.js"></script> -->
    
    <!-- Main App - Load as module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
